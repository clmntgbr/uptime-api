# Production broker configuration (single node, KRaft). Scale to 3 brokers with
# replication 3 and min.insync.replicas=2 before opening to customers.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
log.dirs=/var/lib/kafka/data

listeners=INTERNAL://:9092,CONTROLLER://:9093
advertised.listeners=INTERNAL://kafka:9092
listener.security.protocol.map=INTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=INTERNAL

sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD}";

ssl.keystore.type=PEM
ssl.keystore.location=/etc/kafka-custom/secrets/broker.pem
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka-custom/secrets/ca.pem
ssl.client.auth=none

authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:admin

auto.create.topics.enable=false
message.max.bytes=4194304
replica.fetch.max.bytes=4194304
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1
min.insync.replicas=1
group.initial.rebalance.delay.ms=3000
