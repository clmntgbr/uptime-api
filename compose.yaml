x-go-prod: &go-prod
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  restart: unless-stopped

x-kafka-client-env: &kafka-client-env
  KAFKA_BROKERS: kafka:9092
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_TLS: "true"
  KAFKA_TLS_CA_FILE: /run/secrets/kafka-ca.pem

services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      SITE_ADDRESS: ${CADDY_SITE_ADDRESS}
    networks: [edge]
    restart: unless-stopped

  api:
    <<: *go-prod
    command: ["./api"]
    environment:
      <<: *kafka-client-env
      GO_ENV: ${GO_ENV}
      PORT: ${PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS}
      CORS_MAX_AGE: ${CORS_MAX_AGE}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      TRUST_PROXY: "true"
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_FRONTEND_API: ${CLERK_FRONTEND_API}
      CENTRIFUGO_URL: ${CENTRIFUGO_URL}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_PUBLIC_WS_URL: ${CENTRIFUGO_PUBLIC_WS_URL}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      JOB_SEAL_PUBLIC_KEY: ${JOB_SEAL_PUBLIC_KEY}
      DATABASE_URL: ${API_DATABASE_URL}
      KAFKA_CLIENT_ID: api
      KAFKA_USERNAME: api
      KAFKA_PASSWORD: ${KAFKA_API_PASSWORD}
    volumes:
      - ./deploy/kafka/secrets/ca.pem:/run/secrets/kafka-ca.pem:ro
    networks: [edge, backend, data]
    deploy:
      replicas: 2

  worker-scheduler:
    <<: *go-prod
    command: ["./worker-scheduler"]
    environment:
      <<: *kafka-client-env
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      JOB_SEAL_PUBLIC_KEY: ${JOB_SEAL_PUBLIC_KEY}
      RESULTS_RETENTION_DAYS: ${RESULTS_RETENTION_DAYS}
      SCHEDULER_MAX_JITTER: ${SCHEDULER_MAX_JITTER}
      HEARTBEAT_URL: ${HEARTBEAT_URL}
      DATABASE_URL: ${SCHEDULER_DATABASE_URL}
      KAFKA_CLIENT_ID: worker-scheduler
      KAFKA_USERNAME: worker-scheduler
      KAFKA_PASSWORD: ${KAFKA_SCHEDULER_PASSWORD}
    volumes:
      - ./deploy/kafka/secrets/ca.pem:/run/secrets/kafka-ca.pem:ro
    networks: [backend, data, heartbeat]

  worker:
    <<: *go-prod
    command: ["./worker"]
    environment:
      <<: *kafka-client-env
      GO_ENV: ${GO_ENV}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      CENTRIFUGO_URL: ${CENTRIFUGO_URL}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_PUBLIC_WS_URL: ${CENTRIFUGO_PUBLIC_WS_URL}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      JOB_SEAL_PUBLIC_KEY: ${JOB_SEAL_PUBLIC_KEY}
      DATABASE_URL: ${WORKER_DATABASE_URL}
      KAFKA_CLIENT_ID: worker
      KAFKA_USERNAME: worker
      KAFKA_PASSWORD: ${KAFKA_WORKER_PASSWORD}
    volumes:
      - ./deploy/kafka/secrets/ca.pem:/run/secrets/kafka-ca.pem:ro
    networks: [backend, data]
    deploy:
      replicas: 2

  worker-notify:
    <<: *go-prod
    command: ["./worker-notify"]
    environment:
      <<: *kafka-client-env
      KAFKA_CLIENT_ID: worker-notify
      KAFKA_USERNAME: worker-notify
      KAFKA_PASSWORD: ${KAFKA_WORKER_NOTIFY_PASSWORD}
      GO_ENV: ${GO_ENV}
      METRICS_ADDR: ${METRICS_ADDR:-:9100}
      WORKER_NOTIFY_CONCURRENCY: ${WORKER_NOTIFY_CONCURRENCY:-20}
      DATABASE_URL: ${WORKER_DATABASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    networks: [backend, data, egress]
    deploy:
      replicas: 1

  worker-calls:
    <<: *go-prod
    command: ["./worker-calls"]
    environment:
      <<: *kafka-client-env
      KAFKA_CLIENT_ID: worker-calls
      KAFKA_USERNAME: worker-calls
      KAFKA_PASSWORD: ${KAFKA_WORKER_CALLS_PASSWORD}
      JOB_SEAL_PUBLIC_KEY: ${JOB_SEAL_PUBLIC_KEY}
      JOB_SEAL_PRIVATE_KEY: ${JOB_SEAL_PRIVATE_KEY}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT}
      HTTP_ALLOW_PROXY: ${HTTP_ALLOW_PROXY:-false}
      STORAGE_ENDPOINT: ${STORAGE_INTERNAL_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    volumes:
      - ./deploy/kafka/secrets/ca.pem:/run/secrets/kafka-ca.pem:ro
    read_only: true
    cap_drop: [ALL]
    user: "10001"
    mem_limit: 512m
    networks: [egress, backend]
    deploy:
      replicas: 2

  kafka:
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/bash", "/etc/kafka-custom/start.sh"]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
    volumes:
      - ./deploy/kafka/server.properties:/etc/kafka-custom/server.properties:ro
      - ./deploy/kafka/start.sh:/etc/kafka-custom/start.sh:ro
      - ./deploy/kafka/secrets:/etc/kafka-custom/secrets:ro
      - kafkadata:/var/lib/kafka/data
    networks: [backend, egress]
    restart: unless-stopped

  kc:
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/bash", "/scripts/topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SECURITY: sasl
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
      KAFKA_API_PASSWORD: ${KAFKA_API_PASSWORD}
      KAFKA_SCHEDULER_PASSWORD: ${KAFKA_SCHEDULER_PASSWORD}
      KAFKA_WORKER_PASSWORD: ${KAFKA_WORKER_PASSWORD}
      KAFKA_WORKER_CALLS_PASSWORD: ${KAFKA_WORKER_CALLS_PASSWORD}
      KAFKA_WORKER_NOTIFY_PASSWORD: ${KAFKA_WORKER_NOTIFY_PASSWORD}
      REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
    volumes:
      - ./deploy/kafka:/scripts:ro
    depends_on: [kafka]
    networks: [backend]

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: ["centrifugo", "-c", "config.json"]
    volumes:
      - ./centrifugo:/centrifugo:ro
    working_dir: /centrifugo
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS}
    networks: [edge, backend]
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true
  data:
    internal: true
  egress:
  # Outbound only, for the worker-scheduler heartbeat to the external watchdog.
  heartbeat:

volumes:
  kafkadata:
  pgdata:
  caddy_data:
